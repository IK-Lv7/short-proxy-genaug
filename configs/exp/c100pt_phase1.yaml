# Major 5 (review): fine-tune CIFAR-100 (50/class) with ImageNet-pretrained ResNet-50 (32px upscaled to 224px).
# First risk check: baseline seed variance and deciding the number of training steps
name: c100pt_phase1
reference: baseline
seeds: [0, 1, 2]
overrides:
  data: {resize: 224}
  model: {name: resnet50_pretrained}
  train: {steps: 4000, record_every: 200, batch_size: 32, lr: 0.01, weight_decay: 1.0e-4}
conditions:
  baseline: {}
