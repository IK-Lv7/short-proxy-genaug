# Scale-up: fine-tune CIFAR-100 subset 0 with ImageNet-pretrained ViT-B/16 (32px -> 224px).
# Generated images and training settings are the same as c100pt_gen (ResNet-50). Total 4000 iterations fixed in advance to match ResNet-50
name: vit_gen
reference: baseline
seeds:
- 0
- 1
- 2
- 3
- 4
overrides:
  data:
    resize: 224
  model:
    name: vitb16_pretrained
  train:
    steps: 4000
    record_every: 200
    batch_size: 32
    lr: 0.01
    weight_decay: 0.0001
conditions:
  baseline: {}
  roundtrip_r1.0:
    aug:
      generated:
        name: resize_roundtrip
        ratio: 1.0
  img2img_s0.5_r1.0:
    aug:
      generated:
        name: img2img_s0.5
        ratio: 1.0
  img2img_s1.0_r1.0:
    aug:
      generated:
        name: img2img_s1.0
        ratio: 1.0
  img2img_s1.0_r0.5:
    aug:
      generated:
        name: img2img_s1.0
        ratio: 0.5
  inpaint_center_m0.75_r1.0:
    aug:
      generated:
        name: inpaint_center_m0.75
        ratio: 1.0
  inpaint_border_k0.75_r1.0:
    aug:
      generated:
        name: inpaint_border_k0.75
        ratio: 1.0
  img2img_s1.0_sketch_r1.0:
    aug:
      generated:
        name: img2img_s1.0_sketch
        ratio: 1.0
  img2img_s1.0_g1.0_r1.0:
    aug:
      generated:
        name: img2img_s1.0_g1.0
        ratio: 1.0
  s1.0_noise0.25:
