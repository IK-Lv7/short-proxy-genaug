# Fix total iterations at 16000 and measure Δaccuracy of generative augmentation
# (in pilot_gen, adding images increased training steps, which alone raised accuracy by +3pt)
name: fixedsteps_gen
reference: baseline
seeds: [0, 1, 2, 3, 4]
overrides:
  train: {steps: 16000}
conditions:
  baseline: {}
  roundtrip_r1.0:
    aug: {generated: {name: resize_roundtrip, ratio: 1.0}}
  img2img_s0.3_r1.0:
    aug: {generated: {name: img2img_s0.3, ratio: 1.0}}
  img2img_s0.5_r1.0:
    aug: {generated: {name: img2img_s0.5, ratio: 1.0}}
  img2img_s0.7_r1.0:
    aug: {generated: {name: img2img_s0.7, ratio: 1.0}}
  img2img_s0.85_r1.0:
    aug: {generated: {name: img2img_s0.85, ratio: 1.0}}
  img2img_s1.0_r1.0:
    aug: {generated: {name: img2img_s1.0, ratio: 1.0}}
