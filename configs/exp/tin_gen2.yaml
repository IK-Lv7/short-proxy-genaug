# 6 extra Tiny-ImageNet conditions (more validation of G / P1000). Baseline is the one from tin_gen
name: tin_gen2
reference: tin_gen/baseline
seeds: [0, 1, 2, 3, 4]
overrides:
  data: {name: tinyimagenet, root: data/tinyimagenet}
  train: {steps: 16000}
conditions:
  s1.0_noise0.25:         {aug: {generated: {name: img2img_s1.0_tin, ratio: 1.0, label_noise: {name: img2img_s1.0_wrong_tin, rate: 0.25}}}}
  s1.0_noise1.0:          {aug: {generated: {name: img2img_s1.0_tin, ratio: 1.0, label_noise: {name: img2img_s1.0_wrong_tin, rate: 1.0}}}}
  img2img_s1.0_r0.25:     {aug: {generated: {name: img2img_s1.0_tin, ratio: 0.25}}}
  img2img_s1.0_r0.5:      {aug: {generated: {name: img2img_s1.0_tin, ratio: 0.5}}}
  img2img_s1.0_g1.0_r1.0: {aug: {generated: {name: img2img_s1.0_g1.0_tin, ratio: 1.0}}}
  img2img_s0.7_r1.0:      {aug: {generated: {name: img2img_s0.7_tin, ratio: 1.0}}}
