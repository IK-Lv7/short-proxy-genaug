# Generalization check: 7 main conditions on Tiny-ImageNet (200 classes × 50 images). Metrics and decision rules are those fixed on subset 0
name: tin_gen
reference: baseline
seeds: [0, 1, 2, 3, 4]
overrides:
  data: {name: tinyimagenet, root: data/tinyimagenet}
  train: {steps: 16000}
conditions:
  baseline: {}
  roundtrip_r1.0:           {aug: {generated: {name: resize_roundtrip_tin, ratio: 1.0}}}
  img2img_s0.5_r1.0:        {aug: {generated: {name: img2img_s0.5_tin, ratio: 1.0}}}
  img2img_s1.0_r1.0:        {aug: {generated: {name: img2img_s1.0_tin, ratio: 1.0}}}
  s1.0_noise0.5:            {aug: {generated: {name: img2img_s1.0_tin, ratio: 1.0, label_noise: {name: img2img_s1.0_wrong_tin, rate: 0.5}}}}
  inpaint_center_m0.75_r1.0: {aug: {generated: {name: inpaint_center_m0.75_tin, ratio: 1.0}}}
  img2img_s1.0_sketch_r1.0: {aug: {generated: {name: img2img_s1.0_sketch_tin, ratio: 1.0}}}
