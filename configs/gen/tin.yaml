# Generalization check: build main conditions on Tiny-ImageNet (200 classes × 50 images). Generation settings same as CIFAR-100
common:
  source:
    dataset: tinyimagenet
    n_per_class: 50
    n_val_per_class: 50
    subset_seed: 0
  out_root: data/generated
  n_per_image: 1
  seed: 0
  resolution: 512
variants:
  resize_roundtrip_tin:
    method: resize_roundtrip
  img2img_s0.5_tin:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 0.5
  img2img_s1.0_tin:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 1.0
  img2img_s1.0_wrong_tin:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 1.0
    wrong_prompt: true
  inpaint_center_m0.75_tin:
    method: inpaint
    model: stable-diffusion-v1-5/stable-diffusion-inpainting
    cache_dir: data/hf_cache
    variant: fp16
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    strength: 1.0
    batch_size: 8
    mask_mode: center
    mask_frac: 0.75
  img2img_s1.0_sketch_tin:
    cache_dir: data/hf_cache
    negative_prompt: blurry, low quality, text, watermark
    num_inference_steps: 30
    batch_size: 8
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: a black and white pencil sketch of a {cls}
    strength: 1.0
    guidance_scale: 7.5
  # Added (2026-10-18): more conditions to validate G / P1000
  img2img_s0.7_tin:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 0.7
  img2img_s1.0_g1.0_tin:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 1.0
    num_inference_steps: 30
    batch_size: 8
    strength: 1.0
