# Sixth check: test the combination of G and the duplication/diversity check (D) with new generation conditions where diversity drops naturally

common:
  source: {n_per_class: 50, n_val_per_class: 50, subset_seed: 0}
  out_root: data/generated
  n_per_image: 1
  seed: 0
  resolution: 512
  cache_dir: data/hf_cache
  negative_prompt: "blurry, low quality, text, watermark"
  num_inference_steps: 30
  batch_size: 8
variants:
  # Generate same-class images from the same noise (at s=1.0 the source image contributes little, so images are nearly identical)
  img2img_s1.0_cseed:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: "a photo of a {cls}"
    strength: 1.0
    guidance_scale: 7.5
    seed_per_class: true
  # Same as above, s=0.85 (some of the source image remains)
  img2img_s0.85_cseed:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: "a photo of a {cls}"
    strength: 0.85
    guidance_scale: 7.5
    seed_per_class: true
  # Stronger guidance (diversity drops; seeds as usual)
  img2img_s1.0_g15:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: "a photo of a {cls}"
    strength: 1.0
    guidance_scale: 15.0
  # Same-class images from the same noise, with inpainting
  inpaint_center_m0.75_cseed:
    method: inpaint
    model: stable-diffusion-v1-5/stable-diffusion-inpainting
    variant: fp16
    prompt: "a photo of a {cls}"
    guidance_scale: 7.5
    strength: 1.0
    mask_mode: center
    mask_frac: 0.75
    seed_per_class: true
