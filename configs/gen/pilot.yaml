# Generative-augmentation pilot: 3 img2img strengths + a resize-only control
common:
  source: {n_per_class: 50, n_val_per_class: 50, subset_seed: 0}
  out_root: data/generated
  n_per_image: 1               # generated images per real image
  seed: 0
  resolution: 512
variants:
  resize_roundtrip:
    method: resize_roundtrip
  img2img_s0.3: &img2img
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: "a photo of a {cls}"
    negative_prompt: "blurry, low quality, text, watermark"
    guidance_scale: 7.5
    num_inference_steps: 30    # actually runs strength × steps
    batch_size: 8
    strength: 0.3
  img2img_s0.5: {<<: *img2img, strength: 0.5}
  img2img_s0.7: {<<: *img2img, strength: 0.7}
  img2img_s0.85: {<<: *img2img, strength: 0.85}
  img2img_s1.0: {<<: *img2img, strength: 1.0}
  # For label-noise intervention: generate all images with a prompt of a class different from the original (labels saved as original)
  img2img_s0.7_wrong: {<<: *img2img, strength: 0.7, wrong_prompt: true}
  img2img_s1.0_wrong: {<<: *img2img, strength: 1.0, wrong_prompt: true}
