# Generation for Flowers102 (10/class). Upscale 256px source images to 512px, generate, then resize back to 256px
# Prompts add "a type of flower", following prior work (e.g., DA-Fusion)
common:
  source: {dataset: flowers102, n_per_class: 10, n_val_per_class: 10, subset_seed: 0}
  out_root: data/generated
  n_per_image: 1
  seed: 0
  resolution: 512
  cache_dir: data/hf_cache
  prompt: "a photo of a {cls}, a type of flower"
  negative_prompt: "blurry, low quality, text, watermark"
  guidance_scale: 7.5
  num_inference_steps: 30
  batch_size: 8
variants:
  resize_roundtrip_fl: {method: resize_roundtrip}
  img2img_s0.5_fl: {method: img2img, model: stable-diffusion-v1-5/stable-diffusion-v1-5, strength: 0.5}
  img2img_s1.0_fl: {method: img2img, model: stable-diffusion-v1-5/stable-diffusion-v1-5, strength: 1.0}
  img2img_s1.0_wrong_fl: {method: img2img, model: stable-diffusion-v1-5/stable-diffusion-v1-5, strength: 1.0, wrong_prompt: true}
  img2img_s1.0_g1.0_fl: {method: img2img, model: stable-diffusion-v1-5/stable-diffusion-v1-5, strength: 1.0, guidance_scale: 1.0}
  img2img_s1.0_sketch_fl:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    strength: 1.0
    prompt: "a black and white pencil sketch of a {cls}, a type of flower"
  inpaint_center_m0.75_fl:
    method: inpaint
    model: stable-diffusion-v1-5/stable-diffusion-inpainting
    variant: fp16
    strength: 1.0
    mask_mode: center
    mask_frac: 0.75
