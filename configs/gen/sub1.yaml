# Generalization check: rebuild the main conditions with another subset (subset_seed=1). Generation settings same as subset 0
common:
  source:
    n_per_class: 50
    n_val_per_class: 50
    subset_seed: 1
  out_root: data/generated
  n_per_image: 1
  seed: 0
  resolution: 512
variants:
  resize_roundtrip_sub1:
    method: resize_roundtrip
  img2img_s0.5_sub1:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 0.5
  img2img_s1.0_sub1:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 1.0
  img2img_s1.0_wrong_sub1:
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    cache_dir: data/hf_cache
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    batch_size: 8
    strength: 1.0
    wrong_prompt: true
  inpaint_center_m0.75_sub1:
    method: inpaint
    model: stable-diffusion-v1-5/stable-diffusion-inpainting
    cache_dir: data/hf_cache
    variant: fp16
    prompt: a photo of a {cls}
    negative_prompt: blurry, low quality, text, watermark
    guidance_scale: 7.5
    num_inference_steps: 30
    strength: 1.0
    batch_size: 8
    mask_mode: center
    mask_frac: 0.75
  img2img_s1.0_sketch_sub1:
    cache_dir: data/hf_cache
    negative_prompt: blurry, low quality, text, watermark
    num_inference_steps: 30
    batch_size: 8
    method: img2img
    model: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: a black and white pencil sketch of a {cls}
    strength: 1.0
    guidance_scale: 7.5
